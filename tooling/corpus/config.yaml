# =============================================================================
# PHARMEAZOR — clean corpus configuration
# =============================================================================
# The raw corpus is owned by the data-collection project and is never modified.
# This pipeline reads it and writes a new, normalized corpus under ./output.
#
# `data_root` must point at the raw PHARMEAZOR collection. It is resolved in this
# order:
#   1. the --data-root CLI flag
#   2. the PHARMEAZOR_DATA_ROOT environment variable
#   3. the value below, resolved relative to this file
# The committed default is deliberately relative so no machine-specific home
# directory is baked into the repository.

data_root: "../../../PHARMEAZOR/PHARMEAZOR"
output_root: "output"

paths:
  documents_csv: "data/metadata/documents.csv"
  sources_csv: "data/metadata/sources.csv"
  medicines_csv: "data/input/medicines.csv"
  name_map_csv: "data/metadata/name_map.csv"
  needs_attention_csv: "data/metadata/needs_attention.csv"
  raw_dir: "data/raw"

# Authority ranking is the one used by the project brief:
#   1 = official Algerian SmPC / package leaflet (ANPP)
#   2 = official Algerian nomenclature (Ministry of Pharmaceutical Industry)
#   3 = foreign institutional reference (ANSM/BDPM, DailyMed, EMA)
#   4 = Algerian professional website (Pharm'Net, secondary only)
# Lower number wins when two sources disagree.
sources:
  ANPP_RCP:
    name: "ANPP — Résumé des caractéristiques du produit (RCP)"
    rank: 1
    tier: "official_algerian_smpc"
    jurisdiction: "DZ"
  ANPP_SITE:
    name: "ANPP — Agence Nationale des Produits Pharmaceutiques"
    rank: 1
    tier: "official_algerian_agency"
    jurisdiction: "DZ"
  SANTE_MSP:
    name: "Ministère de la Santé — Nomenclature nationale"
    rank: 2
    tier: "official_algerian_nomenclature"
    jurisdiction: "DZ"
  BDPM_FR:
    name: "Base de données publique des médicaments (France)"
    rank: 3
    tier: "foreign_institutional"
    jurisdiction: "FR"
  DAILYMED:
    name: "DailyMed (U.S. National Library of Medicine)"
    rank: 3
    tier: "foreign_institutional"
    jurisdiction: "US"
  EMA:
    name: "European Medicines Agency (EPAR)"
    rank: 3
    tier: "foreign_institutional"
    jurisdiction: "EU"
  PHARMNET:
    name: "Pharm'Net (Algerian professional website)"
    rank: 4
    tier: "algerian_professional"
    jurisdiction: "DZ"
  PHARMNET_CATALOG:
    name: "Pharm'Net catalogue (Algerian nomenclature mirror)"
    rank: 4
    tier: "algerian_professional"
    jurisdiction: "DZ"

# Sections the project brief requires for every medicine, and which the
# retrieval layer treats as first-class filters.
key_sections:
  - indications
  - dosage
  - contraindications
  - interactions

# Chunking preview only. Final chunking belongs to the retrieval pipeline;
# this proves the clean files split cleanly with the intended settings.
chunking:
  tokenizer: "cl100k_base"
  chunk_size_tokens: 900
  chunk_overlap_tokens: 135
  min_tokens: 40
  merge_min_tokens: 80
  max_tokens: 1100
  preview_chunks_per_document: 2

# Near-duplicate detection. DailyMed publishes many labels for the same INN
# from different manufacturers; keeping all of them poisons retrieval.
dedupe:
  enabled: true
  shingle_words: 5
  exact_threshold: 1.0
  near_threshold: 0.93
  # Never collapse official Algerian docs unless they are byte-identical.
  official_threshold: 0.985

# Boilerplate that must not reach the embeddings.
drop_line_patterns:
  - "^Redirection vers le haut de page$"
  - "^Retour aux résultats$"
  - "^Imprimer$"
  - "^Aller au glossaire$"
  - "^Cliquez ici"
  - "^Ouvrir la page de détail"
  - "^Haut de page$"
  - "^Partager$"
  - "^Copier le lien"
  - "^Sommaire$"
  - "^Table des matières$"

# BDPM "fiche info" blocks that are prices/stock/administrative noise.
# The project brief explicitly excludes prices and stock information.
drop_section_codes:
  - "price"
  - "reimbursement"
  - "smr"
  - "asmr"
  - "stock"
