# Compose override — pgvector guard.
#
# `docker-compose.yml` is generator-owned: GhostInit regenerates it from its
# template during `ghostinit sync` or `ghostinit upgrade`, which would restore
# the plain `postgres:18.6` image and drop the vector extension. This file is
# project-owned, so the pgvector image and the extension bootstrap survive that
# regeneration.
#
# Compose merges this file over `docker-compose.yml` automatically. Keep the two
# in agreement: the values below mirror the postgres service in the base file.
#
# Do not run `docker compose -f docker-compose.yml ...` without this file. The
# documented commands use default file discovery, which picks both up.
services:
  postgres:
    build:
      context: docker/postgres
      dockerfile: Dockerfile
    image: pharmeazor/postgres-pgvector:18.7-0.8.7
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
