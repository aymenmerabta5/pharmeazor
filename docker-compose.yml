version: "3.8"
# Supply interpolation values without injecting the complete application environment:
# docker compose --env-file .env.local up -d
services:
  postgres:
    # Postgres 18.7 with pgvector 0.8.7. Both versions are pinned: the base is
    # the official postgres image and the extension comes from the signed PGDG
    # repository that image already trusts. See docker/postgres/Dockerfile.
    build:
      context: docker/postgres
      dockerfile: Dockerfile
    image: pharmeazor/postgres-pgvector:18.7-0.8.7
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 stores versioned data below /var/lib/postgresql/18/docker.
      # Mount the parent so upgrades retain the image-managed directory layout.
      - postgres_data:/var/lib/postgresql
      # Registers the vector extension on first initialization. The entrypoint
      # runs this directory only for an empty PGDATA; an existing database gets
      # the extension from its Drizzle migration.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
volumes:
  postgres_data:
