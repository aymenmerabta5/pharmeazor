# Complete local infrastructure for pharmeazor.
#
#   docker compose --env-file .env.local up -d --build
#
# Everything the application needs to run locally lives here: Postgres 18.7
# with pgvector 0.8.7, Neo4j 5.26.34 Community for the knowledge graph, Redis
# 7.4.12, and the Upstash-compatible REST proxy the cache adapter talks to.
# There is deliberately no `docker-compose.override.yml`: a second file let the
# two drift, and the pgvector build is not optional for this project.
#
# `docker-compose.yml` is generator-owned. A `ghostinit sync` may rewrite it;
# re-apply this file afterwards. The build stays reproducible because
# `docker/postgres/Dockerfile` pins both the server patch and the extension, and
# the two third-party images are pinned by digest, not by a floating tag.

name: pharmeazor

services:
  postgres:
    # Postgres 18.7 with pgvector 0.8.7. Both versions are pinned: the base is
    # the official postgres image and the extension comes from the signed PGDG
    # repository that image already trusts. See docker/postgres/Dockerfile.
    build:
      context: docker/postgres
      dockerfile: Dockerfile
    image: pharmeazor/postgres-pgvector:18.7-0.8.7
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      # Postgres 18 stores versioned data below /var/lib/postgresql/18/docker.
      # Mount the parent so upgrades retain the image-managed directory layout.
      - postgres_data:/var/lib/postgresql
      # Registers the vector extension on first initialization. The entrypoint
      # runs this directory only for an empty PGDATA; an existing database gets
      # the extension from `bun run db:ensure-extensions`.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  neo4j:
    # Neo4j 5.26.34 Community, pinned by digest. The graph importer is
    # approval-gated; this service only provides the external database target.
    # Host ports are deliberately non-standard so this can run beside another
    # local Neo4j instance. Browser: http://localhost:7475/browser/
    # Bolt: bolt://localhost:7688
    image: neo4j:5.26.34-community@sha256:2c48628bc28c68d7e2787f76262dfc9d7c21a8f7f290e30da901c489aa7fe50d
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      # The image consumes NEO4J_AUTH. NEO4J_USER/NEO4J_PASSWORD are also
      # exposed to the health check so it never needs hardcoded credentials.
      NEO4J_AUTH: "${NEO4J_USER:?NEO4J_USER is required}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"
      NEO4J_USER: "${NEO4J_USER:?NEO4J_USER is required}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"
      NEO4J_server_http_listen__address: "0.0.0.0:7474"
      NEO4J_server_bolt_listen__address: "0.0.0.0:7687"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL_SIZE:-512m}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX_SIZE:-1G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE_SIZE:-512m}"
      NEO4J_dbms_security_auth__minimum__password__length: "8"
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7475}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'cypher-shell -u "$${NEO4J_USER}" -p "$${NEO4J_PASSWORD}" ''RETURN 1'' >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  redis:
    # Pinned by digest: `7-alpine` is a moving tag, and a silent Redis minor
    # bump must not change the cache semantics under a running deployment.
    image: redis@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  serverless-redis-http:
    # Upstash-compatible REST front end for Redis. The cache adapter speaks the
    # Upstash protocol, so the application talks to this service, never to Redis
    # directly. It reaches Redis by service name, not through the host.
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: "${UPSTASH_REDIS_REST_TOKEN:?UPSTASH_REDIS_REST_TOKEN is required}"
      SRH_CONNECTION_STRING: "redis://redis:6379/0"
    ports:
      - "127.0.0.1:${SRH_PORT:-8079}:80"
    depends_on:
      redis:
        condition: service_healthy

  # Retrieval models served by Text Embeddings Inference (TEI).
  #
  # Both services sit behind the `retrieval` profile so a checkout without GPU
  # access still runs `docker compose up` unchanged:
  #
  #   docker compose --env-file .env.local --profile retrieval up -d
  #
  # The image is pinned by digest because a TEI minor release can change
  # tokenization or kernels. The weights are mounted read-only from a local
  # snapshot instead of being downloaded at startup: the corpus in
  # `retrieval_chunks` records the revision that produced its vectors, and
  # serving a different one would put queries and documents in different
  # embedding spaces. Refresh a snapshot with the model's `revision` and point
  # RETRIEVAL_*_MODEL_DIR at it.
  retrieval-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:bee0bdb887096229add91b6fdfcf95258c12eb9180e90dc86f3b4b25b86fc613
    profiles: ["retrieval"]
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["--model-id", "/data", "--port", "80"]
    volumes:
      - "${RETRIEVAL_EMBEDDING_MODEL_DIR:-./tooling/embedding-lab/models/bge-m3}:/data:ro"
    ports:
      - "127.0.0.1:${RETRIEVAL_EMBEDDING_PORT:-8081}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # Loading a 2 GB snapshot from disk dominates the start period.
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

  retrieval-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:bee0bdb887096229add91b6fdfcf95258c12eb9180e90dc86f3b4b25b86fc613
    profiles: ["retrieval"]
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["--model-id", "/data", "--port", "80"]
    volumes:
      - "${RETRIEVAL_RERANKER_MODEL_DIR:-./tooling/embedding-lab/models/bge-reranker-v2-m3}:/data:ro"
    ports:
      - "127.0.0.1:${RETRIEVAL_RERANKER_PORT:-8082}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

volumes:
  postgres_data:
  neo4j_data:
    # Persistent graph data. `docker compose down` preserves it; `down -v`
    # deletes it and is never part of normal operation.
  neo4j_logs:
  redis_data:
